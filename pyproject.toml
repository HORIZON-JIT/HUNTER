[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hunter"
version = "0.1.0"
description = "Multi-agent research & analysis system powered by Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "anthropic>=0.40.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "schedule>=1.2",
]

[tool.setuptools]
packages = ["hunter", "hunter.x_theme_generator"]

[project.scripts]
hunter = "hunter.main:cli"
hunter-xtheme = "hunter.x_theme_generator.cli:main"
