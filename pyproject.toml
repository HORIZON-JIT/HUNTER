[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hunter"
version = "0.1.0"
description = "Multi-agent research & analysis system powered by Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
]

[project.scripts]
hunter = "hunter.main:cli"
